name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux]
        goarch: [amd64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Go Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
          if [ "${{ matrix.goos }}" = "windows" ]; then
            CC=x86_64-w64-mingw32-gcc go build -ldflags="-s -w" -o dist/netguard-hub-windows-amd64.exe .
          else
            go build -ldflags="-s -w" -o dist/netguard-hub-linux-amd64 .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netguard-hub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/netguard-hub-*
